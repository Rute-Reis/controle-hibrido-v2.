<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Controle Híbrido v2</title>

    <!-- SUPORTE NATIVO PARA IOS (IPHONE) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Controle Híbrido">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/app-icon.png">

    <!-- LEAFLET, BOOTSTRAP ICONS E CHART.JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-body: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --bg-input: #f8f9fa;
            --text-main: #212529;
            --text-muted: #8c959f;
            --border-color: #dee2e6;
            --border-card: #e9ecef;
            --shadow-card: rgba(0, 0, 0, 0.05);

            --color-presencial: #2e7d32;
            --bg-presencial: #e8f5e9;
            --color-homeoffice: #0288d1;
            --bg-homeoffice: #e1f5fe;
            --color-folga: #ed6c02;
            --bg-folga: #fff3e0;
            --color-fds: #9c27b0;
            --bg-fds: #f3e5f5;

            --nav-active: #0d3b66;
        }

        body.dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-header: #1e1e1e;
            --bg-input: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2a2a2a;
            --border-card: #2a2a2a;
            --shadow-card: rgba(0, 0, 0, 0.4);

            --bg-presencial: #1b431e;
            --color-presencial: #81c784;
            --bg-homeoffice: #0d3c61;
            --color-homeoffice: #64b5f6;
            --bg-folga: #4a2800;
            --color-folga: #ffb74d;
            --bg-fds: #3b1348;
            --color-fds: #ba68c8;

            --nav-active: #4dabf7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body { 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding-bottom: 90px; 
            max-width: 500px; 
            margin: 0 auto; 
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent; 
            transition: background 0.3s, color 0.3s;
        }

        .header { 
            text-align: center; 
            padding: 16px 18px; 
            background: var(--bg-header); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 10px var(--shadow-card);
        }
        .header-title { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .header i { font-size: 22px; color: #4dabf7; }
        .header h1 { font-size: 18px; color: var(--text-main); font-weight: 700; white-space: nowrap; }

        .btn-theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            width: auto !important;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .container { padding: 15px; }

        .tab-content { 
            display: none; 
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }
        .tab-content.active { 
            display: block; 
            opacity: 1;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            padding: 10px 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border-card);
            box-shadow: 0 2px 10px var(--shadow-card);
        }
        .btn-month-nav {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: auto !important;
        }
        .month-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .card { 
            background-color: var(--bg-card); 
            padding: 18px; 
            border-radius: 18px; 
            margin-bottom: 16px; 
            border: 1px solid var(--border-card); 
            box-shadow: 0 4px 18px var(--shadow-card); 
            transition: background-color 0.3s;
        }
        .card h3 { 
            font-size: 15px; 
            margin-bottom: 14px; 
            color: var(--text-main); 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            margin-bottom: 14px;
            font-size: 14px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(90deg, #0d3b66 0%, #134e89 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 15px; 
            box-shadow: 0 4px 12px rgba(13, 59, 102, 0.25);
        }

        .btn-export { width: auto; padding: 6px 12px; font-size: 12px; background: #0d3b66; border-radius: 8px; color: white; border: none; cursor: pointer; }

        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            max-width: 500px; 
            margin: 0 auto; 
            background-color: var(--bg-card); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            height: 68px;
            padding: 0 10px 14px 10px; 
            border-top: 1px solid var(--border-color); 
            z-index: 100; 
            box-shadow: 0 -4px 20px var(--shadow-card); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-item { 
            background: none !important; 
            border: none !important; 
            color: var(--text-muted); 
            font-size: 11px; 
            font-weight: 500;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            padding: 6px 0; 
            flex: 1; 
            height: 100%;
            border-radius: 0 !important;
            box-shadow: none !important;
            transition: color 0.2s ease, transform 0.1s ease;
        }

        .nav-item i { 
            font-size: 21px; 
            margin-bottom: 3px; 
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .nav-item:active { transform: scale(0.95); }

        .nav-item.active { 
            color: var(--nav-active) !important; 
            font-weight: 700; 
        }

        .nav-item.active i { 
            transform: translateY(-2px); 
            color: var(--nav-active) !important; 
        }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
        .cal-head { font-size: 11px; color: var(--text-muted); font-weight: bold; padding-bottom: 4px; }
        .cal-empty { background: transparent; }
        .cal-day { background-color: var(--bg-input); padding: 10px 0; border-radius: 10px; font-size: 12px; cursor: pointer; border: 1px solid transparent; color: var(--text-main); font-weight: 500; }

        .cal-day.Presencial { background-color: var(--bg-presencial); color: var(--color-presencial); font-weight: bold; border: 1px solid var(--color-presencial); }
        .cal-day.HomeOffice { background-color: var(--bg-homeoffice); color: var(--color-homeoffice); font-weight: bold; border: 1px solid var(--color-homeoffice); }
        .cal-day.Folga { background-color: var(--bg-folga); color: var(--color-folga); font-weight: bold; border: 1px solid var(--color-folga); }
        .cal-day.FinalDeSemana { background-color: var(--bg-fds); color: var(--color-fds); font-weight: bold; border: 1px solid var(--color-fds); }

        .badge-tipo { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
        .badge-Presencial { background-color: var(--bg-presencial); color: var(--color-presencial); border: 1px solid var(--color-presencial); }
        .badge-HomeOffice { background-color: var(--bg-homeoffice); color: var(--color-homeoffice); border: 1px solid var(--color-homeoffice); }
        .badge-Folga { background-color: var(--bg-folga); color: var(--color-folga); border: 1px solid var(--color-folga); }
        .badge-FinalDeSemana { background-color: var(--bg-fds); color: var(--color-fds); border: 1px solid var(--color-fds); }

        .hist-item-card {
            background-color: var(--bg-card);
            border-radius: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-card);
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow-card);
        }
        .hist-header-content { padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .hist-details { display: none; padding: 12px 14px 14px 14px; border-top: 1px dashed var(--border-color); background-color: var(--bg-input); }
        .hist-details.active { display: block; animation: fadeIn 0.25s ease-in-out; }

        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-action-delete { background-color: #dc3545; color: white; padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; width: auto; }

        .progress-bar-bg { background-color: var(--bg-input); border-radius: 8px; height: 10px; width: 100%; overflow: hidden; margin: 10px 0; border: 1px solid var(--border-color); }
        .progress-bar-fill { background: linear-gradient(90deg, #2e7d32, #81c784); height: 100%; width: 0%; transition: width 0.4s ease; }

        .map-container { height: 180px; width: 100%; border-radius: 12px; margin-top: 10px; z-index: 1; }
        .map-hist { height: 150px; width: 100%; border-radius: 10px; margin-top: 8px; z-index: 1; }
        .thumb-img { max-width: 100%; max-height: 120px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--bg-card); padding: 20px; border-radius: 16px; max-width: 400px; width: 100%; text-align: center; color: var(--text-main); }
        .status-msg { text-align: center; font-size: 13px; font-weight: bold; margin-top: 8px; }
        .status-sucesso { color: #2e7d32; }
        .status-erro { color: #dc3545; }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="header">
        <div class="header-title">
            <i class="bi bi-calendar-check-fill"></i>
            <h1>Controle Híbrido</h1>
        </div>
        <button id="btnTheme" class="btn-theme-toggle" onclick="alternarTema()">
            <i class="bi bi-moon-fill"></i> <span id="lblTheme">Escuro</span>
        </button>
    </div>

    <div class="container">

        <!-- ABA 1: DASHBOARD -->
        <div id="tabDashboard" class="tab-content active">
            <div class="month-selector">
                <button class="btn-month-nav" onclick="navegarMes(-1)"><i class="bi bi-chevron-left"></i></button>
                <span class="month-title displayMesAno"></span>
                <button class="btn-month-nav" onclick="navegarMes(1)"><i class="bi bi-chevron-right"></i></button>
            </div>

            <div class="card">
                <h3>📊 Progresso do Mês</h3>
                <h2 id="totalPresencial" style="font-size: 18px; color: var(--color-presencial);">0 Dias Presenciais</h2>
                <div id="detalhesMétricas" style="font-size: 12px; margin-top: 12px; line-height: 1.6;"></div>
                <div class="progress-bar-bg">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
                <p id="pctProgressoAtual" style="font-size: 12px; font-weight: bold; margin-top: 4px;"></p>
                <p id="pctPresencial" style="font-size: 11px; color: var(--text-muted); margin-top: 4px;"></p>
            </div>

            <div class="card">
                <h3>📈 Distribuição de Jornada</h3>
                <div style="height: 200px; position: relative;">
                    <canvas id="graficoJornada"></canvas>
                </div>
                <div id="detalhesMétricas" style="font-size: 12px; margin-top: 12px; line-height: 1.6;"></div>
            </div>

            <div class="card">
                <h3>🗓 Calendário Mensal</h3>
                <div id="gridCalendario" class="cal-grid"></div>
            </div>
        </div>

        <!-- ABA 2: NOVO REGISTRO DE PONTO -->
        <div id="tabNovo" class="tab-content">
            <div class="card">
                <h3>📌 Registrar Ponto</h3>
                <form id="formPonto">
                    <label for="dataManual">Data:</label>
                    <input type="date" id="dataManual" name="data" required>

                    <label for="tipo">Tipo de Ponto:</label>
                    <select id="tipo" name="tipo" required>
                        <option value="Presencial">Presencial</option>
                        <option value="Home Office">Home Office</option>
                        <option value="Folga">Folga / Feriado</option>
                        <option value="Final de Semana">Final de Semana</option>
                    </select>

                    <label for="empresa">Empresa:</label>
                    <input type="text" id="empresa" name="empresa" value="Vivo" placeholder="Nome da Empresa">

                    <label for="observacao">Observação:</label>
                    <input type="text" id="observacao" name="observacao" placeholder="Ex: Reunião presencial de equipe">

                    <label for="foto">Comprovante / Foto:</label>
                    <input type="file" id="foto" name="foto" accept="image/*">

                    <label>Localização Atual (GPS):</label>
                    <div id="mapaLocal" class="map-container"></div>

                    <button type="submit" id="btnSalvar" style="margin-top: 16px;">💾 Salvar Registro</button>
                    <div id="statusMsg" class="status-msg"></div>
                </form>
            </div>
        </div>

        <!-- ABA 3: HISTÓRICO -->
        <div id="tabHistorico" class="tab-content">
            <div class="card" style="padding-bottom: 8px;">
                <h3>
                    📜 Histórico Registrado
                    <button class="btn-export" onclick="exportarCSV()"><i class="bi bi-download"></i> CSV</button>
                </h3>
            </div>
            <div id="listaHistorico"></div>
        </div>

    </div>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="mudarAba('tabDashboard', this)">
            <i class="bi bi-house-door-fill"></i>
            <span>Início</span>
        </button>
        <button class="nav-item" onclick="mudarAba('tabNovo', this)">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Registrar</span>
        </button>
        <button class="nav-item" onclick="mudarAba('tabHistorico', this)">
            <i class="bi bi-clock-history"></i>
            <span>Histórico</span>
        </button>
    </div>

    <!-- MODAL DE LEMBRETE DE PONTO -->
    <div id="reminderModal" class="modal">
        <div class="modal-content">
            <i class="bi bi-alarm" style="font-size: 36px; color: #0d3b66;"></i>
            <h3 style="margin: 10px 0;">Lembrete de Ponto</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Você ainda não registrou o seu ponto de hoje!</p>
            <button onclick="irParaRegistroPonto()">Registrar Agora</button>
            <button onclick="fecharLembrete()" style="background: transparent; color: var(--text-muted); border: none; margin-top: 8px; box-shadow: none;">Lembrar depois</button>
        </div>
    </div>

    <!-- MODAL DE IMAGEM AMPLIADA -->
    <div id="imgModal" class="modal" onclick="fecharModal()">
        <div class="modal-content" style="background: transparent; box-shadow: none;">
            <img id="imgExpanded" src="" style="max-width: 100%; max-height: 80vh; border-radius: 12px;" alt="Ampliado">
        </div>
    </div>

    <!-- LEAFLET JS E SCRIPT DA APLICAÇÃO -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
